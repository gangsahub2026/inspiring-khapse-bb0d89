
name: Collect Company Jobs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect company jobs
        run: python collect_company_jobs.py

      - name: Save collected jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update company jobs"
            git push
          fi
